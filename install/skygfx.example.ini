; ============================================================================
; SkyGfx Extended - sample configuration
;
; Usage:
;   1. Copy this file next to skygfx.asi in your GTA San Andreas folder and
;      rename it to "skygfx.ini" (main config), or to "skygfx1.ini" ...
;      "skygfx9.ini" for presets (switch between them in-game, see below).
;   2. Only change what you need. Missing keys fall back to the defaults
;      shown in the comments.
;
; In-game:
;   keySwitch = <hex scancode>   key that cycles through skygfx1..9.ini
;   keyReload = <hex scancode>   key that reloads all .ini files
;   Hex scancodes: 0x01=Esc 0x02=1 0x03=2 0x04=3 0x05=4 0x06=5 0x07=6 0x08=7
;                  0x09=8 0x0A=9 0x0B=0 0x1E=A 0x1F=B 0x20=C 0x21=D 0x22=E
;                  0x23=F 0x24=G 0x25=H 0x26=I 0x27=J 0x28=K 0x29=L 0x2B=M
;                  0x2C=N 0x2D=O 0x2E=P 0x2F=Q 0x30=R 0x31=S 0x32=T
;                  0x13=Enter 0x1C=LeftShift 0x2A=RightShift
;
; All effects default to OFF / the values marked "default" below - a game
; with no ini at all behaves exactly like SkyGfx before this version.
; ============================================================================

[SkyGfx]

; ---- presets ---------------------------------------------------------------
;keySwitch   = 0x0     ; key that switches between skygfx1..9.ini presets (0 = off)
;keyReload   = 0x0     ; key that reloads all .ini files (0 = off)

; ---- pipelines -------------------------------------------------------------
; Which building/vehicle render pipeline to use.
;   buildingPipe    : PS2 | Xbox           (default: game default)
;   tagsBuildingPipe: PS2 | Xbox           (default: game default)
;   vehiclePipe     : PS2 | PC | Xbox | Spec | Neo | Leeds | LCS | VCS | Mobile | Env
;buildingPipe     = PS2
;tagsBuildingPipe = PS2
;vehiclePipe      = PS2
;explicitBuildingPipe = -1  ; force a building pipe for specific tag groups (-1 = auto)

; PS2 texture modulation (dithered look). 1 = on. The Global switches drive
; all sub-switches below when they are not set explicitly.
;ps2Modulate         = 0
;ps2ModulateBuilding = 0
;ps2ModulateGrass    = 0

; Dual-pass transparency (fixes blending/z artifacts). 1 = on.
;dualPass         = 0
;dualPassDefault  = 0
;dualPassBuilding = 0
;dualPassVehicle  = 0
;dualPassPed      = 0
;dualPassGrass    = 0
; alpha threshold (0-255, default 128) used by the dual passes
;zwriteThreshold        = 128
;zwriteThresholdGrass   = 128
;zwriteThresholdPed     = 128

; ---- buildings -------------------------------------------------------------
;detailMaps         = 0  ; PS2-style detail maps on buildings
;stochasticTexturing = 0 ; stochastic (dithered) texture sampling
;forceWindShader    = 0  ; force the wind shader even where the game doesn't use it
;disableClouds      = 0  ; disable cloud rendering
;disableGamma       = 0  ; disable the game's gamma correction
;coronaZtest        = -1 ; -1 = default (PS2), 0 = disable, 1 = force (PC)

; ---- vehicles --------------------------------------------------------------
;sunGlare         = -1  ; PS2 sun glare: -1 = auto (PS2 filter only), 0 = off, 1 = on
;neoWaterDrops    = -1  ; Neo-style water drops on the camera: -1 = auto, 0 = off, 1 = on
;neoBloodDrops    = 0   ; Neo-style blood drops
;fixPcCarLight    = 0   ; fix PC car light
;fixShadows       = 0   ; fix shadows
;transparentLockon = 0  ; transparent lock-on HUD
;envMapUseLODs    = 0   ; use LODs for the vehicle environment map

; vehicle environment map (pipeline "Env")
;envMapSize        = 256  ; power of two, 4..2048
;envMapFarClipMult = 1.0
;envShininessMult  = 1.0
;envSpecularityMult = 1.0
;envPower          = 20.0
;envFresnel        = 0.7
; other per-pipeline knobs
;leedsShininessMult = 1.0
;neoShininessMult   = 1.0
;neoSpecularityMult = 1.0

; ---- grass -----------------------------------------------------------------
;grassFixPlacement = 0  ; fix PS2 grass placement
;grassAddAmbient   = 0  ; add ambient light to grass
;grassBackfaceCull = 1  ; cull grass back faces (1 = on)

; ---- shadows ---------------------------------------------------------------
; 0/false = off, 1/true = on
;pedShadows     = 0  ; PS2-style ped shadows
;stencilShadows = 0  ; stencil shadows

; ---- radiosity (soft light bounce) -----------------------------------------
;doRadiosity          = 0  ; enable radiosity (unset = keep the game's original setting)
;radiosity            = Shader  ; PS2 | Shader (default: Shader)
;radiosityFilterPasses = 2
;radiosityRenderPasses = 1
;radiosityIntensity    = 35
;lightningIlluminatesWorld = 0  ; 0 = sky only, 1 = sky and objects

; ---- VCS trails --------------------------------------------------------------
;vcsTrails       = 0  ; Vice City style trails
;trailsLimit     = 80
;trailsIntensity = 38
;trailsResolution = 1

; ---- colour ----------------------------------------------------------------
; PS2/PC style colour filter and timecycle
;colorFilter  = PC     ; None | PS2 | PC | Mobile | III | VC | VCS
;usePCTimecyc = 0      ; use the PC (not PS2) timecycle colours
;rgb1Mult     = 1.0    ; colour filter rgb1 multiplier
;rgb2Mult     = 1.0    ; colour filter rgb2 multiplier
; PS2 colour filter blur offsets in pixels (default = game value)
;blurLeft   = 4000
;blurTop    = 4000
;blurRight  = 4000
;blurBottom = 4000
; vision filters: PS2 = PS2 style, PC = game default
;infraredVision = PC
;nightVision    = PC
;grainFilter    = PC

; ---- screen fx (bloom / exposure / tone map / dithering) --------------------
; Bloom: adds a soft glow around bright areas (headlamps, neon, sun glare).
;doBloom         = 0     ; enable bloom
;bloomIntensity  = 0.5   ; 0..2, glow strength
;bloomThreshold  = 0.7   ; 0..1, brightness cutoff for the glow
;bloomIterations = 2     ; 1..3, blur radius (more = wider, slower)

; Exposure and filmic tone mapping (applied after everything else).
;exposure   = 1.0  ; global exposure multiplier (1.0 = unchanged)
;doToneMap  = 0    ; enable the filmic tone map
;whitePoint = 1.0  ; tone map white point (0.1..8)

; PS2-style 15-bit dithering: quantises the final image to 32 levels per
; channel with a blue-noise pattern, like the PS2 framebuffer.
;ps2Dither = 0

; ---- screen fx 2 -------------------------------------------------------------
; Auto exposure: smoothly boosts exposure in dark scenes (night) based on the
; current timecycle ambient light.
;doAutoExposure   = 0   ; enable auto exposure
;autoExposureGain = 0.8 ; extra exposure at full darkness (0 = no boost)

; Extra bloom intensity at night (1.0 = double the bloom when fully dark).
;bloomNightBoost = 0.0

; Retro screen finish:
;vignetteStrength    = 0.0 ; 0..1, darken the corners of the screen
;chromaticAberration = 0.0 ; 0..1, subtle red/blue fringing (higher = stronger)
;ps2Grain            = 0   ; PS2-style grain + 2px scanlines (pre-baked pattern)
;ps2GrainStrength    = 0.3 ; 0..1, grain/scanline strength

; Internal resolution: render the scene at a lower resolution and upscale it
; in the final pass. Softer PS2-like look and fewer scene pixels (FPS gain).
; EXPERIMENTAL: default 1.0 (off). May interact with the PS2 color filter
; (a one-frame ghost band at the bottom/right edge) - set to 1.0 if you see it.
;renderScale = 1.0 ; 0.5..1.0
;renderScaleDebugLog = 0 ; 0/1: log D3D viewport/projection events to skygfx_renderScale.log (diagnostics only)

; ---- YCbCr tweak (final colour correction) ----------------------------------
;YCbCrCorrection = 0  ; enable the YCbCr correction pass
;lumaScale  = 0.8588  ; 219/255
;lumaOffset = 0.0627  ; 16/255
;CbScale    = 1.23
;CbOffset   = 0.0
;CrScale    = 1.23
;CrOffset   = 0.0

; ---- misc --------------------------------------------------------------------
;privateHooks = 0  ; use private hook addresses (for conflicting mods)
